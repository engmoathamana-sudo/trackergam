<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام التتبع الذكي والإنذار الميداني</title>
 
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
 
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    @keyframes pulse-bg-red {
      0%, 100% { background-color: #dc2626; }
      50% { background-color: #7f1d1d; }
    }
    @keyframes pulse-bg-amber {
      0%, 100% { background-color: #d97706; }
      50% { background-color: #78350f; }
    }
    .warning-pulse-red { animation: pulse-bg-red 0.6s infinite; }
    .warning-pulse-amber { animation: pulse-bg-amber 1s infinite; }
    #map { height: 48vh; width: 100%; z-index: 10; touch-action: none; }
  </style>
</head>
<body id="mainBody" class="min-h-screen bg-slate-900 text-white flex flex-col transition-colors duration-300 font-sans select-none">

  <!-- 1. شريط البحث والتحكم العلوي -->
  <header class="bg-slate-800 p-2.5 border-b border-slate-700">
    <div class="flex gap-2 items-center">
      <div class="relative flex-1">
        <input type="text" id="searchInput" onkeypress="if(event.key === 'Enter') searchLocation()" placeholder="🔍 ابحث عن موقع، حي، أو شارع..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition">
      </div>
      <button onclick="searchLocation()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition">
        بحث
      </button>
    </div>
    <div id="searchStatus" class="text-[10px] text-emerald-400 h-3 px-1 mt-0.5"></div>
  </header>

  <!-- 2. الخريطة الميدانية وأزرار التمركز -->
  <div class="relative">
    <div id="map" class="border-b-2 border-slate-700"></div>
   
    <!-- أدوات التمركز عائمة -->
    <div class="absolute bottom-3 left-3 z-20 flex flex-col gap-2">
      <button onclick="toggleAutoFollow()" id="followBtn" class="bg-slate-900/90 text-slate-400 p-2 rounded-full shadow-2xl border border-slate-600 text-[10px] font-bold">
        📹 كاميرا ثابتة
      </button>
      <button onclick="locateUserNow()" class="bg-slate-900/90 text-amber-400 p-2.5 rounded-full shadow-2xl border border-slate-600 text-base">
        🎯
      </button>
    </div>
  </div>

  <!-- 3. لوحة التتبع وأدوات حفظ الموقع -->
  <main class="flex-1 p-3 flex flex-col justify-between space-y-2 overflow-y-auto">
   
    <!-- وحدة أدوات حفظ المواقع -->
    <div class="bg-slate-800/95 p-2.5 rounded-2xl border border-slate-700 flex justify-between items-center gap-2">
      <button onclick="saveCurrentLocation()" class="flex-1 bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-2 rounded-xl text-xs transition flex items-center justify-center gap-1 shadow-md">
        💾 حفظ الموقع الحالي
      </button>
      <button onclick="toggleSavedLocationsList()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold px-3 py-2 rounded-xl text-xs transition">
        📍 المحفوظة (<span id="savedCount">0</span>)
      </button>
    </div>

    <!-- قائمة المواقع المحفوظة -->
    <div id="savedLocationsPanel" class="hidden bg-slate-800 p-3 rounded-2xl border border-slate-600 max-h-36 overflow-y-auto space-y-1.5 text-xs">
      <div class="font-bold text-amber-400 mb-1 border-b border-slate-700 pb-1">قائمة المواقع المحفوظة:</div>
      <div id="savedListContainer" class="space-y-1"></div>
    </div>

    <!-- قسم تتبع رابط مشترك / إحداثيات -->
    <div class="bg-slate-800/90 p-2 rounded-2xl border border-slate-700 flex gap-2">
      <input type="text" id="linkInput" placeholder="إلصق رابط Google Maps أو إحداثيات..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-amber-300 focus:outline-none dir-ltr">
      <button onclick="parseAndSetTarget()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition">تتبع</button>
      <button onclick="clearTarget()" class="bg-slate-700 text-slate-300 font-bold px-2 py-1.5 rounded-xl text-xs">إلغاء</button>
    </div>

    <!-- أزرار التحكم بالحدود والتتبع -->
    <div class="flex gap-2">
      <button onclick="clearPolygon()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 rounded-xl text-xs font-bold border border-slate-700 transition">
        🗑️ مسح الحدود
      </button>
      <button id="trackBtn" onclick="toggleTracking()" class="flex-2 bg-blue-600 hover:bg-blue-500 text-white py-2.5 px-4 rounded-xl text-xs font-bold shadow-lg transition">
        📍 بدء التتبع الذكي والإنذار
      </button>
    </div>

    <!-- المؤشر الرئيسي للحالة الميدانية -->
    <div class="text-center py-1">
      <div id="statusIcon" class="text-3xl inline-block">🛰️</div>
      <span id="statusTitle" class="text-base font-extrabold mr-2">جاهز لبدء التتبع</span>
    </div>

    <!-- شريط القياسات والحساسات -->
    <footer class="bg-slate-800/90 p-2.5 rounded-2xl border border-slate-700 space-y-1.5">
      <div class="flex justify-between items-center text-xs">
        <span class="text-slate-400">عن أقرب حد: <strong id="edgeDistance" class="text-emerald-400">--</strong></span>
        <span class="text-slate-400">عن الهدف: <strong id="targetDistance" class="text-amber-400">غير محدد</strong></span>
      </div>
      <div class="flex justify-between items-center text-[10px] text-slate-400 font-mono border-t border-slate-700/50 pt-1.5">
        <span>Lat: <strong id="latVal" class="text-slate-200">--</strong></span>
        <span>Lng: <strong id="lngVal" class="text-slate-200">--</strong></span>
        <span>دقة الـ GPS: <strong id="accVal" class="text-emerald-400">--</strong> م</span>
      </div>
    </footer>
  </main>

  <script>
    const map = L.map('map', {
      zoomControl: false, tap: false, touchZoom: true, dragging: true
    }).setView([31.9882, 35.8654], 15);

    L.control.zoom({ position: 'topleft' }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, attribution: 'Esri Satellite'
    }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19
    }).addTo(map);

    let drawnPoints = [];
    let polygonLayer = null;
    let userMarker = null;
    let accuracyCircle = null;
    let targetMarker = null;
    let targetLatLng = null;
    let watchId = null;
    let isTracking = false;
    let autoFollow = false;
    let audioCtx = null;
    let alarmInterval = null;
    let currentLat = null;
    let currentLng = null;

    function fixMapSize() { setTimeout(() => { map.invalidateSize(); }, 300); }
    window.addEventListener('load', () => { fixMapSize(); updateSavedLocationsUI(); });
    window.addEventListener('resize', fixMapSize);

    // تفعيل نظام الصوت باللمس لتجاوز قيود متصفحات الهواتف
    function initAudioOnMobile() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function startInstantAlarm() {
      if (!alarmInterval) {
        triggerAudioBeep(950);
        alarmInterval = setInterval(() => { triggerAudioBeep(950); }, 250);
      }
    }

    function stopInstantAlarm() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
    }

    function triggerAudioBeep(freq = 880) {
      try {
        initAudioOnMobile();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch(e) {}
    }

    function saveCurrentLocation() {
      if (!currentLat || !currentLng) {
        alert("تنبيه: لم يتم تحديد موقعك عبر الـ GPS حتى الآن. يرجى تفعيل الموقع والانتقال لمكان مكشوف.");
        return;
      }
      const defaultName = `موقع (${new Date().toLocaleTimeString('ar-JO', {hour: '2-digit', minute:'2-digit'})})`;
      const name = prompt("أدخل اسماً مخصصاً لهذا الموقع:", defaultName);
      if (!name) return;

      let saved = JSON.parse(localStorage.getItem('userSavedLocations') || '[]');
      saved.push({ id: Date.now(), name: name, lat: currentLat, lng: currentLng });
      localStorage.setItem('userSavedLocations', JSON.stringify(saved));
     
      updateSavedLocationsUI();
      alert("تم حفظ الموقع بنجاح! 💾");
    }

    function toggleSavedLocationsList() {
      document.getElementById('savedLocationsPanel').classList.toggle('hidden');
    }

    function updateSavedLocationsUI() {
      let saved = JSON.parse(localStorage.getItem('userSavedLocations') || '[]');
      document.getElementById('savedCount').innerText = saved.length;
      const container = document.getElementById('savedListContainer');
     
      if (saved.length === 0) {
        container.innerHTML = '<div class="text-slate-500 text-[11px]">لا توجد مواقع محفوظة حالياً.</div>';
        return;
      }

      container.innerHTML = saved.map((item) => `
        <div class="flex justify-between items-center bg-slate-900 p-2 rounded-lg border border-slate-700">
          <span class="font-bold text-slate-200 text-xs">${item.name}</span>
          <div class="flex gap-1">
            <button onclick="jumpToSavedLocation(${item.lat}, ${item.lng})" class="bg-amber-600 hover:bg-amber-500 text-white px-2 py-0.5 rounded text-[10px]">انتقال 🎯</button>
            <button onclick="deleteSavedLocation(${item.id})" class="bg-red-700 hover:bg-red-600 text-white px-2 py-0.5 rounded text-[10px]">حذف 🗑️</button>
          </div>
        </div>
      `).join('');
    }

    function jumpToSavedLocation(lat, lng) {
      map.flyTo([lat, lng], 17);
      L.popup().setLatLng([lat, lng]).setContent(`<b>📍 موقع محفوظ</b>`).openOn(map);
    }

    function deleteSavedLocation(id) {
      let saved = JSON.parse(localStorage.getItem('userSavedLocations') || '[]');
      saved = saved.filter(item => item.id !== id);
      localStorage.setItem('userSavedLocations', JSON.stringify(saved));
      updateSavedLocationsUI();
    }

    async function searchLocation() {
      const query = document.getElementById('searchInput').value.trim();
      const status = document.getElementById('searchStatus');
      if (!query) return;

      status.innerText = "⏳ جاري البحث عن الموقع...";
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
        const data = await res.json();
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          map.flyTo([lat, lon], 17, { animate: true, duration: 1 });
          L.popup().setLatLng([lat, lon]).setContent(`<b>📍 ${data[0].display_name}</b>`).openOn(map);
          status.innerText = "✓ تم العثور على الموقع";
          setTimeout(() => { status.innerText = ""; }, 3000);
        } else {
          alert("لم يتم العثور على الموقع المطلوب.");
          status.innerText = "";
        }
      } catch (e) {
        alert("حدث خطأ أثناء البحث.");
        status.innerText = "";
      }
    }

    function toggleAutoFollow() {
      autoFollow = !autoFollow;
      const btn = document.getElementById('followBtn');
      btn.className = autoFollow ? "bg-slate-900/90 text-emerald-400 p-2 rounded-full border border-emerald-500 font-bold" : "bg-slate-900/90 text-slate-400 p-2 rounded-full border border-slate-600 font-bold";
    }

    function locateUserNow() {
      initAudioOnMobile();
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition((position) => {
          map.flyTo([position.coords.latitude, position.coords.longitude], 18);
        }, (err) => {
          alert("تعذر تحديد موقعك. يرجى التاكد من تفعيل خدمة الـ GPS على الهاتف والسماح للمتصفح الوصول للموقع.");
        }, { enableHighAccuracy: true });
      }
    }

    function parseAndSetTarget() {
      const input = document.getElementById('linkInput').value.trim();
      if (!input) return;
      const match = input.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || input.match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/) || input.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
      if (match) {
        const lat = parseFloat(match[1]), lng = parseFloat(match[2]);
        targetLatLng = L.latLng(lat, lng);
        if (targetMarker) map.removeLayer(targetMarker);
        targetMarker = L.marker([lat, lng]).addTo(map).bindPopup("🎯 الهدف").openPopup();
        map.flyTo([lat, lng], 17);
      }
    }

    function clearTarget() {
      if (targetMarker) map.removeLayer(targetMarker);
      targetMarker = null; targetLatLng = null;
      document.getElementById('linkInput').value = "";
      document.getElementById('targetDistance').innerText = "غير محدد";
    }

    map.on('click', function(e) {
      if (!isTracking) {
        drawnPoints.push([e.latlng.lat, e.latlng.lng]);
        drawPolygonOnMap();
      }
    });

    function drawPolygonOnMap() {
      if (polygonLayer) map.removeLayer(polygonLayer);
      if (drawnPoints.length > 0) {
        polygonLayer = L.polygon(drawnPoints, { color: '#10b981', fillColor: '#10b981', fillOpacity: 0.25, weight: 3 }).addTo(map);
      }
    }

    function clearPolygon() {
      if (isTracking) toggleTracking();
      drawnPoints = [];
      if (polygonLayer) map.removeLayer(polygonLayer);
      resetUI();
    }

    function isInsideBoundary(point, vs) {
      if (vs.length < 3) return true;
      let x = point[0], y = point[1], inside = false;
      for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
        let xi = vs[i][0], yi = vs[i][1], xj = vs[j][0], yj = vs[j][1];
        let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function getMinDistanceToPolygonEdge(lat, lng, vs) {
      if (vs.length < 2) return Infinity;
      let minDistance = Infinity;
      const mLat = 111139, mLng = 111139 * Math.cos(lat * Math.PI / 180);
      for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
        let x1 = vs[j][1] * mLng, y1 = vs[j][0] * mLat, x2 = vs[i][1] * mLng, y2 = vs[i][0] * mLat;
        let px = lng * mLng, py = lat * mLat;
        let A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
        let dot = A * C + B * D, len_sq = C * C + D * D;
        let param = len_sq !== 0 ? dot / len_sq : -1;
        let xx = param < 0 ? x1 : param > 1 ? x2 : x1 + param * C;
        let yy = param < 0 ? y1 : param > 1 ? y2 : y1 + param * D;
        let dist = Math.sqrt((px - xx)**2 + (py - yy)**2);
        if (dist < minDistance) minDistance = dist;
      }
      return minDistance;
    }

    function toggleTracking() {
      initAudioOnMobile(); // إيقاظ الصوت فور الضغط
      const btn = document.getElementById('trackBtn');
      if (!isTracking) {
        if (drawnPoints.length < 3 && !targetLatLng) {
          alert("يرجى تحديد حدود على الخريطة أولاً بالنقر على 3 نقاط على الأقل.");
          return;
        }
        isTracking = true;
        btn.innerHTML = "⏹️ إيقاف التتبع";
        btn.classList.replace('bg-blue-600', 'bg-slate-700');
        if ("geolocation" in navigator) {
          watchId = navigator.geolocation.watchPosition(updatePosition, handleGpsError, {
            enableHighAccuracy: true, maximumAge: 0, timeout: 10000
          });
        }
      } else {
        isTracking = false;
        btn.innerHTML = "📍 بدء التتبع الذكي والإنذار";
        btn.classList.replace('bg-slate-700', 'bg-blue-600');
        if (watchId) navigator.geolocation.clearWatch(watchId);
        stopInstantAlarm();
        resetUI();
      }
    }

    function handleGpsError(err) {
      alert("⚠️ تعذر تحديد موقع الـ GPS! يرجى التأكد من تفعيل زر (الموقع/Location) على هاتفك وإعطاء المتصفح الإذن بالوصول للموقع.");
    }

    function updatePosition(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const acc = position.coords.accuracy;
      currentLat = lat; currentLng = lng;

      document.getElementById('latVal').innerText = lat.toFixed(5);
      document.getElementById('lngVal').innerText = lng.toFixed(5);
      document.getElementById('accVal').innerText = Math.round(acc);

      if (targetLatLng) {
        const dist = L.latLng(lat, lng).distanceTo(targetLatLng);
        document.getElementById('targetDistance').innerText = dist > 1000 ? (dist/1000).toFixed(2) + " كم" : Math.round(dist) + " متر";
      }

      if (autoFollow) map.panTo([lat, lng], { animate: true });

      if (!userMarker) {
        userMarker = L.circleMarker([lat, lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#2563eb', fillOpacity: 1 }).addTo(map);
        accuracyCircle = L.circle([lat, lng], { radius: acc, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.15, weight: 1 }).addTo(map);
        map.setView([lat, lng], 17);
      } else {
        userMarker.setLatLng([lat, lng]);
        accuracyCircle.setLatLng([lat, lng]);
        accuracyCircle.setRadius(acc);
      }

      if (drawnPoints.length >= 3) {
        const isInside = isInsideBoundary([lat, lng], drawnPoints);
        const distanceToEdge = getMinDistanceToPolygonEdge(lat, lng, drawnPoints);
        document.getElementById('edgeDistance').innerText = Math.round(distanceToEdge) + " متر";

        const body = document.getElementById('mainBody');
        const icon = document.getElementById('statusIcon');
        const title = document.getElementById('statusTitle');

        if (isInside) {
          if (distanceToEdge <= 15) {
            stopInstantAlarm();
            body.className = "min-h-screen warning-pulse-amber text-white flex flex-col font-sans select-none";
            icon.innerText = "⚠️";
            title.innerText = `انتبه: تقترب من الحدود! (${Math.round(distanceToEdge)} م)`;
            triggerAudioBeep(650);
          } else {
            stopInstantAlarm();
            body.className = "min-h-screen bg-emerald-950 text-white flex flex-col font-sans select-none";
            icon.innerText = "🛡️";
            title.innerText = "داخل المسار/النطاق الآمن";
          }
        } else {
          body.className = "min-h-screen warning-pulse-red text-white flex flex-col font-sans select-none";
          icon.innerText = "🚨";
          title.innerText = "خطر: تجاوزت الحدود المحددة!";
          startInstantAlarm();
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }
      }
    }

    function resetUI() {
      stopInstantAlarm();
      document.getElementById('mainBody').className = "min-h-screen bg-slate-900 text-white flex flex-col font-sans select-none";
      document.getElementById('statusIcon').innerText = "🛰️";
      document.getElementById('statusTitle').innerText = "جاهز لبدء التتبع";
      document.getElementById('edgeDistance').innerText = "--";
      if (userMarker) {
        map.removeLayer(userMarker); map.removeLayer(accuracyCircle);
        userMarker = null; accuracyCircle = null;
      }
    }
  </script>
</body>
</html>
